<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive, nofollow">
<meta name="theme-color" content="#2E2A24">
<meta name="description" content="یک کارت تولد.">
<title>یک کارت برای تو</title>
<link rel="stylesheet" href="css/paper.css">
<link rel="stylesheet" href="css/card.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="stage" id="stage" data-scene="sealed">

  <canvas class="confetti-canvas" id="confetti" aria-hidden="true"></canvas>
  <div class="dim" aria-hidden="true"></div>

  <!-- Announcements for screen readers: candles remaining, etc. -->
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <!-- ====================================================================
       Envelope
       ==================================================================== -->
  <div class="envelope" id="envelope">
    <div class="env-back paper" aria-hidden="true"></div>
    <div class="env-flap paper" aria-hidden="true"></div>
    <div class="env-front paper" aria-hidden="true"></div>

    <button class="env-hit" id="openBtn">پاکت رو باز کن</button>
  </div>

  <p class="open-hint" id="openHint" aria-hidden="true">برای بازکردن بزن</p>

  <!-- ====================================================================
       The card
       ==================================================================== -->
  <div class="card-slot" id="cardSlot">
  <article class="card paper deckle" id="card">

    <header class="card-head">
      <!-- Dash lengths are measured with getTotalLength() in main.js rather
           than guessed here, so the draw-on never leaves gaps. -->
      <svg class="sprig" viewBox="0 0 140 40" aria-hidden="true" focusable="false">
        <path d="M14 28 C 48 15, 92 15, 126 28"/>
        <ellipse cx="46" cy="19" rx="9"   ry="4.2" transform="rotate(-34 46 19)"/>
        <ellipse cx="70" cy="15" rx="9"   ry="4.2"/>
        <ellipse cx="94" cy="19" rx="9"   ry="4.2" transform="rotate(34 94 19)"/>
        <ellipse cx="58" cy="27" rx="7.5" ry="3.6" transform="rotate(28 58 27)"/>
        <ellipse cx="82" cy="27" rx="7.5" ry="3.6" transform="rotate(-28 82 27)"/>
        <circle  cx="70" cy="6"  r="2.4"/>
      </svg>

      <h1 class="greeting letterpress">
        <span id="greetingText">تولدت مبارک دیوونه 😂🎂</span>
      </h1>
    </header>

    <!-- Cake ------------------------------------------------------------ -->
    <div class="cake-area">
      <div class="candles" id="candles"></div>
      <div class="cake" aria-hidden="true">
        <div class="frosting"></div>
        <div class="cake-body"></div>
      </div>
      <div class="plate" aria-hidden="true"></div>
    </div>

    <!-- Controls -------------------------------------------------------- -->
    <div class="controls" id="controls">
      <p class="prompt-text" id="promptText">یه آرزو کن</p>

      <button class="btn" id="micBtn" hidden>شمع‌ها رو فوت کن</button>

      <div class="meter" id="meter" hidden aria-hidden="true"><i></i></div>
      <p class="tap-hint" id="tapHint">برای خاموش‌کردن، روی هر شمع بزن.</p>

      <button class="btn-quiet" id="skipBtn">رفتن به پیام</button>
    </div>

    <!-- Message (built by main.js from card-config.js) ------------------- -->
    <div class="message" id="message"></div>

    <button class="btn replay" id="replayBtn">دوباره روشن کن</button>

  </article>
  </div>
</div>

<noscript>
  <p style="color:#FBF6EC;text-align:center;font-family:Georgia,serif;padding:2rem">
    برای بازکردن این کارت، جاوااسکریپت باید فعال باشد.
  </p>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
